# Fail2Ban filter for SMTP AUTH failures on ports 465 and 587, which both log
# as postfix/submission/smtpd. Anchored: only the address right after
# "warning:" can be the host, never the client-chosen sasl_username.

[INCLUDES]

before = common.conf

[Definition]

_daemon = postfix/submission/smtpd

failregex = ^%(__prefix_line)swarning: [-._\w]+\[<HOST>\]: SASL \S+ authentication (?:failed|aborted)

ignoreregex =
