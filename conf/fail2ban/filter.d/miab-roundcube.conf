# Fail2Ban filter for failed Roundcube logins
# Greedy and end-anchored, so the host is the address Roundcube appends after
# the client-chosen user name, not one placed inside it.

[INCLUDES]

before = common.conf

[Definition]

failregex = ^.*IMAP Error: Login failed for .* from <HOST>(?:\(X-Forwarded-For: [^)]*\))?\. AUTHENTICATE.*$

ignoreregex =
