# Fail2Ban filter Mail-in-a-Box management daemon
# Anchored to the daemon's own syslog line: /var/log/syslog also carries the
# Postfix lines, whose sasl_username is chosen by the client.

[INCLUDES]

before = common.conf

[Definition]

_daemon = (?:mailinabox|start|gunicorn)

failregex = ^%(__prefix_line)s(?:\[[^\]]*\] WARNING in daemon: )?Mail-in-a-Box Management Daemon: Failed login attempt from ip <HOST> - timestamp [\d.]+\s*$

ignoreregex =
